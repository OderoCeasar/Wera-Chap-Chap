version: "2"
sql:
    - schema: "db/migrations"
      queries: "db/queries"
      engine: "postgresql"
      gen:
          go:
              package: "db"
              out: "db/sqlc"
              sql_package: "pgx/v5"
              emit_json_tags: true
              emit_interface: true
              emit_empty_slices: true
              emit_pointers_for_null_types: true
              overrides:
                  # Money and coordinates are float64 through the whole app and
                  # the JSON API. Left as pgtype.Numeric every handler would
                  # have to convert, and the numbers would reach the client as
                  # objects instead of numbers.
                  - db_type: "pg_catalog.numeric"
                    go_type: "float64"
                  - db_type: "pg_catalog.numeric"
                    nullable: true
                    go_type:
                        type: "float64"
                        pointer: true
                  # "timestamptz", not "pg_catalog.timestamptz" -- the
                  # qualified spelling silently fails to match and leaves every
                  # timestamp as a pgtype.Timestamptz.
                  - db_type: "timestamptz"
                    go_type:
                        import: "time"
                        type: "Time"
                  - db_type: "timestamptz"
                    nullable: true
                    go_type:
                        import: "time"
                        type: "Time"
                        pointer: true
